interface:
  display_name: "小说推文漫画"
  short_description: "推广原著的一页多格漫画，画面优先、对白内心清楚、跨话承接与原著引导"
  default_prompt: "使用 $static-comic 将我指定且获准推广改编的小说做成用于抖音和小红书图文的一页多格静态推文漫画；目标是吸引读者搜索并阅读原著，不是完整漫画化。先确定原著卖点、剧透边界、停止位置和准确书名，画面准确表达信息，对白/内心有来源，必要信息清楚，不为解释硬加旁白；续话先读上一话结尾并逐项承接未结事件，不能无故跳过，再做分页分镜、逐格无字提示词与已约定的画内或画外搜书信息；贴字先约定辨识策略，可用专属正文字体/字色/轻透明气泡而不画姓名标签；不生成视频，不自动付费出图或上传平台。"
