interface:
  display_name: "小说推文漫画"
  short_description: "推广原著的一页多格漫画，细致图文、明确对白旁白、跨话承接与搜书引导"
  default_prompt: "使用 $static-comic 将我指定且获准推广改编的小说做成用于抖音和小红书图文的一页多格静态推文漫画；目标是吸引读者搜索并阅读原著，不是完整漫画化。先确定原著卖点、剧透边界、停止位置和准确书名，画面准确表达信息，台词旁白详细明确；续话先读上一话结尾并逐项承接未结事件，不能无故跳过，再做分页分镜、逐格无字提示词与末页搜书提示；不生成视频，不自动付费出图或上传平台。"
